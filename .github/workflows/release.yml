name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Validate Version
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          
          # Ensure version starts with 'v'
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected format: v1.0.0 or v1.0.0-rc.1"
            exit 1
          fi
          
          # Check if tag already exists
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "❌ Tag $VERSION already exists"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version validated: $VERSION"

      - name: Verify Docker Image Exists
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          
          # Check if the Docker image exists in GHCR
          echo "Checking for image: ghcr.io/${{ github.repository_owner }}/suproxy-backend:$VERSION"
          
          # Try to pull the image metadata
          docker manifest inspect ghcr.io/${{ github.repository_owner }}/suproxy-backend:$VERSION >/dev/null 2>&1 || {
            echo "⚠️  Docker image not found for version $VERSION"
            echo "This is acceptable for manual releases, but ensure the image will be built"
          }

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "📝 First release - including all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "📝 Generating changelog since $PREVIOUS_TAG"
            COMMITS=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Create changelog using heredoc
          cat > CHANGELOG.tmp <<EOF
          ## What's Changed
          
          $COMMITS
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${VERSION}
          EOF
          
          # Output for next job (escape newlines)
          echo "changelog<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.tmp >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT
          
          echo "✅ Changelog generated"

  tag-docker-image:
    name: Tag Docker Image with Version
    runs-on: ubuntu-latest
    needs: [validate, changelog]
    outputs:
      sha_tag: ${{ steps.find-image.outputs.sha_tag }}
      image_digest: ${{ steps.find-image.outputs.digest }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Find Corresponding Docker Image
        id: find-image
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          
          # Get the commit SHA that will be tagged with this version
          # Use current HEAD since we're about to tag it
          COMMIT_SHA="${{ github.sha }}"
          SHA_SHORT=$(echo $COMMIT_SHA | cut -c1-7)
          SHA_TAG="sha-${SHA_SHORT}"
          
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          
          echo "📦 Version $VERSION will reference Docker image: $SHA_TAG"
          echo "📍 Commit: $COMMIT_SHA"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify Source Image Exists
        id: verify
        run: |
          SHA_TAG="${{ steps.find-image.outputs.sha_tag }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/suproxy-backend:$SHA_TAG"
          
          echo "🔍 Verifying source image exists: $IMAGE"
          
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✅ Source image found: $SHA_TAG"
            DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
            echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          else
            echo "❌ Source image not found: $SHA_TAG"
            echo ""
            echo "This means CI workflow hasn't built an image for commit ${{ steps.find-image.outputs.commit_sha }}"
            echo "Possible reasons:"
            echo "  1. CI workflow is still running"
            echo "  2. CI workflow failed"
            echo "  3. This commit was never pushed to main branch"
            echo ""
            echo "Available images:"
            docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/suproxy-backend:latest" --format '{{json .}}' | jq -r '.manifest.digest' || echo "  (none found)"
            exit 1
          fi
      
      - name: Create Version Tag Alias
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          SHA_TAG="${{ steps.find-image.outputs.sha_tag }}"
          SOURCE_IMAGE="ghcr.io/${{ github.repository_owner }}/suproxy-backend:$SHA_TAG"
          
          echo "🏷️  Creating version tag alias: $VERSION → $SHA_TAG"
          
          # Create version tag as alias to SHA tag (no rebuild, just manifest copy)
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/suproxy-backend:$VERSION" \
            "$SOURCE_IMAGE"
          
          echo "✅ Version tag created: $VERSION"
          echo "📦 Points to same image as: $SHA_TAG"
          echo "🔒 Image digest: ${{ steps.verify.outputs.digest }}"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, changelog, tag-docker-image]
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      release_url: ${{ steps.create_release.outputs.release_url }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Create Git Tag
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          
          echo "✅ Tag created: $VERSION"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: Release ${{ needs.validate.outputs.version }}
          body: |
            ## 🚀 Release ${{ needs.validate.outputs.version }}
            
            ### Docker Images
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/suproxy-backend:${{ needs.validate.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/suproxy-backend:latest
            ```
            
            ### Commit Information
            - **Commit SHA:** `${{ github.sha }}`
            - **Commit Short:** `${{ github.sha }}` (first 7 chars)
            
            ### Deployment
            This release will be automatically deployed to production.
            
            ---
            
            ${{ needs.changelog.outputs.changelog }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          SHA_TAG="${{ needs.tag-docker-image.outputs.sha_tag }}"
          
          echo "## 🎉 Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ inputs.prerelease && 'Pre-release' || 'Stable' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Draft:** ${{ inputs.draft }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- Version tag: \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- Source SHA tag: \`$SHA_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image digest: \`${{ needs.tag-docker-image.outputs.image_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository_owner }}/suproxy-backend:$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  trigger-deployment:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: [validate, release, tag-docker-image]
    if: ${{ !inputs.draft && !inputs.prerelease }}
    
    steps:
      - name: Trigger Deploy Workflow
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ needs.validate.outputs.version }}';
            
            console.log(`Triggering deployment for version ${version}`);
            
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                version: version,
                servers: 'all'
              }
            });
            
            console.log('✅ Deployment triggered');
